name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check (tsc --noEmit)
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  worker:
    name: Worker contract & generated artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.115" "pydantic>=2.7" "numpy>=1.26" "httpx<1"

      - name: Worker contract smoke test
        run: python scripts/test/worker_smoke.py

      - name: Python syntax
        run: python -m compileall -q workers scripts

      - name: Generated notebooks match the worker core
        run: |
          python workers/build_notebooks.py
          git diff --exit-code -- notebooks public/notebooks public/workers src/data
