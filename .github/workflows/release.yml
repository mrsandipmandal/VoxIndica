name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Type check
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Regenerate worker notebooks
        run: python workers/build_notebooks.py

      - name: Worker contract smoke test
        run: |
          python -m pip install "fastapi>=0.115" "pydantic>=2.7" "numpy>=1.26" "httpx<1"
          python scripts/test/worker_smoke.py

      - name: Package release assets
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p release
          (cd dist && zip -qr "../release/voxindica-web-${VERSION}.zip" .)
          zip -qr "release/voxindica-notebooks-${VERSION}.zip" notebooks docs
          zip -qr "release/voxindica-worker-${VERSION}.zip" workers public/workers scripts/local scripts/api
          (cd release && sha256sum ./*.zip > SHA256SUMS.txt)
          ls -lh release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$VERSION" \
            --target "$TARGET" \
            --title "VoxIndica $VERSION" \
            --generate-notes \
            release/*.zip release/SHA256SUMS.txt
